# PH2-E4-07 spike. Its own Cargo workspace so the root workspace (contracts/*)
# and CI are untouched. Not a deliverable; see README.md.
[workspace]
resolver = "2"
members = ["router", "subject"]

[workspace.dependencies]
soroban-sdk = "=27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
