name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Deliberate trigger. The sync's write path must be testable WITHOUT waiting
  # for a real merge — letting the next merge be its first write test is how a
  # broken mirror stays broken for a week.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One canonical pipeline: build/typecheck precedes artifact inspection,
      # and CI cannot omit newly added repository, bundle or publish gates.
      - run: pnpm check

  # The mirror is DERIVED, not maintained. Runs only after a merge to main, so
  # the trigger is the merge itself rather than somebody remembering it.
  #
  # `continue-on-error` is deliberate: a stale Notion row is a nuisance, a red
  # main is a blocker, and the mirror must never be able to take the build down.
  # It still shows as a visible ✗ on the run — non-blocking, never silent.
  #
  # The PARSE half is not here. It lives in `pnpm check` above and runs on every
  # PR, so duplicate and unparseable task IDs are caught before merge with no
  # secret involved. Only the WRITE needs a token.
  notion-mirror:
    name: sync Notion from BACKLOG.md
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # MUST be false. setup-node's package-manager cache defaults to ON and
          # shells out to the detected package manager — and this job has no
          # pnpm, deliberately. The first real run after merge failed here with
          # "Unable to locate executable file: pnpm", before reaching the script
          # at all, so the sync had not run even though the job existed.
          #
          # Adding pnpm/action-setup would fix the symptom and undo the point:
          # this job stays dependency-free so it cannot break when the lockfile
          # changes. Turning the cache off is the fix that keeps that property.
          package-manager-cache: false

      # No install: the script is dependency-free on purpose, so this job cannot
      # be the thing that breaks when the lockfile changes.
      - id: sync
        continue-on-error: true
        run: |
          set +e
          node scripts/sync-notion.mjs 2>&1 | tee /tmp/sync.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SYNC: apply

      # A 401 living only in a log nobody opens means every merge reports green
      # while the mirror silently drifts — the manual-sweep problem back, with an
      # automation badge on it. So the result gets a SURFACE either way.
      - name: Report the sync result where it can be seen
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE='${{ steps.sync.outputs.code }}'
          {
            echo "## Notion mirror sync"
            echo
            if [ "$CODE" = "0" ]; then echo "✅ succeeded"; else echo "❌ FAILED (exit $CODE)"; fi
            echo
            echo '```'
            tail -30 /tmp/sync.log 2>/dev/null || echo "(no output — the job died before the script ran)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$CODE" = "0" ] && exit 0

          # One open issue, not one per run. A failure that pages you every
          # merge gets muted, and a muted alert is the same as no alert.
          TITLE='Notion mirror sync is failing'
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open \
            --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n' \
            "The post-merge Notion sync exited non-zero. \`BACKLOG.md\` stays canonical, so nothing is lost — but **the mirror is drifting and will keep drifting until this is fixed**." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "Commit: \`${{ github.sha }}\`" \
            "" \
            'Last 30 lines:' '```' "$(tail -30 /tmp/sync.log 2>/dev/null)" '```' \
            "" \
            "Closes itself on the next successful sync.")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee Fatihmaull
          fi

      - name: Close the failure issue once a sync succeeds
        if: steps.sync.outputs.code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list --search 'Notion mirror sync is failing in:title' \
            --state open --json number --jq '.[0].number // empty')
          [ -n "$N" ] && gh issue close "$N" \
            --comment "Sync succeeded on \`${{ github.sha }}\`. Closing automatically." || true
