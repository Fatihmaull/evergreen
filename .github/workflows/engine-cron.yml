name: Engine (fallback runner)

# W3-D18-00. The same engine code on a GitHub Actions cron, so the "ran
# unattended" claim does not depend on the production scheduler decision
# (ADR-003) landing before B's crossing on ~2026-09-20. That date cannot be
# moved; the deployment decision can.
on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset off the top of the hour. Scheduling is
    # best-effort on Actions — which is fine here, because the two-tier
    # threshold gives ~7 days of warning before the ~1 day of urgency.
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: read

concurrency:
  group: engine-cron
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      # 🔴 DECIDE-ONLY. No secret is provided to this job, so it CANNOT sign or
      # submit even if the code were changed to try. Execution is W3-D16-01, and
      # it should arrive with its own explicit opt-in rather than inheriting a
      # schedule that already runs unattended.
      - name: Decide (dry-run)
        # `shell: bash` is REQUIRED, not cosmetic. Without it the default shell
        # has no `pipefail`, so `pnpm engine:run | tee` exits with tee's status
        # and a failing engine run reports SUCCESS. The first cron run did
        # exactly that: the script died on a config error and the job went
        # green — a silent failure in the one job that runs unattended.
        shell: bash
        env:
          # The dogfood config, not the example. The example carries deliberate
          # placeholder IDs that loadConfig refuses, which is how the first run
          # failed — correctly, and invisibly.
          EVERGREEN_CONFIG: evergreen.config.dogfood.json
          EVERGREEN_RUN_RECORD: /tmp/engine-record.json
        run: pnpm engine:run | tee /tmp/engine.log

      # A guard refusal is a non-event: no transaction, no hash, nothing an
      # explorer shows. On ~2026-09-20 this is the ONLY trace W3-D18-02b will
      # ever have, so it goes into the run summary rather than only a log.
      - name: Publish the decisions where they can be read
        if: always()
        run: |
          {
            echo '## Engine decisions'
            echo
            echo '```'
            tail -40 /tmp/engine.log 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # W3-D16-03. Week 3 persists WITHOUT a database, so "durable" is defined
      # as step summary PLUS artifact. The summary is for a human reading the
      # run; the artifact is machine-readable and survives log trimming.
      #
      # 90 days covers the sprint with room. Naming it explicitly rather than
      # inheriting a default, because the retention IS the durability guarantee
      # here — an unnamed default is a guarantee nobody checked.
      - name: Upload the run record (durability, W3-D16-03)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/engine-record.json
            /tmp/engine.log
          retention-days: 90
          if-no-files-found: warn
