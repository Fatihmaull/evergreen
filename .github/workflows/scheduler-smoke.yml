name: Scheduler smoke test

on:
  workflow_dispatch:
  schedule:
    # UTC, offset from the busy top of the hour. Scheduling is best-effort.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: scheduler-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Public Testnet reads only. This is separate from offline PR/CI tests.
      - name: Read guinea-pig A instance TTL
        run: pnpm scheduler:smoke
