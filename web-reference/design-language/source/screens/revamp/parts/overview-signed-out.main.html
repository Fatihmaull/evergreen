<main id="main" class="main overview">
  <div class="ov-head">
    <div>
      <p class="eyebrow">Overview · Stellar testnet</p>
      <h1>What expires first, read from the chain</h1>
    </div>
  </div>

  <form class="scan-row" onsubmit="return false;">
    <label class="skip" for="cid">Contract ID</label>
    <input
      id="cid"
      class="search wide mono"
      type="text"
      placeholder="Paste a testnet contract ID, C…"
      spellcheck="false"
    />
    <button class="primary" type="submit">Scan</button>
  </form>
  <p class="note">No wallet, no signup to scan.</p>

  <section class="signin-line" aria-label="Sign in">
    <p>Sign in to watch your contracts and turn on autopilot.</p>
    <button class="secondary" type="button">Sign in</button>
  </section>
</main>
