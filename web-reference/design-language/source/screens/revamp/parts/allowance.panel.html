<aside class="panel-side" aria-label="Change cap">
  <div class="panel-top">
    <div>
      <h2>Change cap</h2>
      <p class="note">A new approve replaces the cap. It does not add to it.</p>
    </div>
    <button class="close" type="button">Close</button>
  </div>
  <ul class="rows">
    <li class="cap-row">
      <input type="checkbox" checked aria-label="Include payments-v2" />
      <div class="cap-copy"><p class="row-title">payments-v2</p></div>
      <p class="mono amount">73,903</p>
    </li>
    <li class="cap-row">
      <input type="checkbox" checked aria-label="Include oracle-feed" />
      <div class="cap-copy"><p class="row-title">oracle-feed</p></div>
      <p class="mono amount">86,234</p>
    </li>
  </ul>
  <div>
    <label class="field-label" for="extends">Extends to cover, per contract</label>
    <input id="extends" class="text-input mono" type="text" inputmode="numeric" value="2" />
  </div>
  <dl class="kv">
    <div>
      <dt>New cap</dt>
      <dd class="mono">520,274 stroops</dd>
    </div>
    <div>
      <dt>Until</dt>
      <dd>ledger <span class="mono">8,510,399</span> · ~May 23, 2027</dd>
    </div>
    <div>
      <dt>Replaces</dt>
      <dd class="mono">665,577 left now</dd>
    </div>
  </dl>
  <div class="actions">
    <button class="primary" type="button">Sign in wallet</button>
  </div>
  <p class="note">Your wallet signs. Evergreen never holds your XLM.</p>
</aside>
