<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Newsreader:opsz,wght@6..72,400&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <script>
      if (location.search.includes('guides')) document.documentElement.classList.add('guides');
    </script>
    <title>Landscape 1920 × 1080 — title card</title>
  </head>
  <body>
    <!-- 16:9: social landscape, and the video title card. A full field of
     pine-deep, as the landing hero is. Title-safe inset 5% × 5%. -->
    <div
      class="canvas on-pine-deep"
      data-format="landscape 1920×1080 · k=2"
      style="
        --w: 1920px;
        --h: 1080px;
        --safe-t: 96px;
        --safe-r: 160px;
        --safe-b: 96px;
        --safe-l: 160px;
      "
    >
      <div class="safe">
        <div class="lockup">
          <span class="mark" aria-hidden="true"></span><span class="word">Evergreen</span>
        </div>
        <div class="spacer"></div>
        <p class="figure-value" style="max-width: 15ch; text-wrap: balance">
          Your contract expires. You just don't know when.
        </p>
        <p class="lead second" style="max-width: 52ch; margin-top: 40px">
          Soroban state runs on a timer measured in ledgers, about five seconds each, and nothing
          tells you it is running out.
        </p>
        <div class="spacer"></div>
        <p class="label muted">Stellar testnet · evergreen-stellar.pages.dev</p>
      </div>
    </div>
  </body>
</html>
