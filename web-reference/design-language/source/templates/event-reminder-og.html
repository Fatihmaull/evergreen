<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Newsreader:opsz,wght@6..72,400&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <script>
      if (location.search.includes('guides')) document.documentElement.classList.add('guides');
    </script>
    <title>Link card 1200 × 630 — Sehari sebelumnya</title>
  </head>
  <body>
    <!-- Day-before reminder. Every content line is a placeholder. Replace it; do not invent an event. -->
    <div
      class="canvas"
      data-format="link card 1200×630 · k=2 · reminder"
      style="
        --w: 1200px;
        --h: 630px;
        --safe-t: 64px;
        --safe-r: 64px;
        --safe-b: 64px;
        --safe-l: 64px;
      "
    >
      <div class="safe">
        <div class="lockup">
          <span class="mark" aria-hidden="true"></span><span class="word">Evergreen</span>
        </div>
        <div class="spacer"></div>
        <div style="display: grid; gap: 12px; max-width: 540px">
          <p class="label muted">Sehari sebelumnya</p>
          <p class="display" style="max-width: 540px">Judul acara</p>
          <p class="body">Tanggal</p>
          <p class="body">Daring atau luring</p>
          <p class="body">Tempat atau tautan</p>
          <p class="body" style="color: var(--pine)">Ajakan <span aria-hidden="true">→</span></p>
          <p class="label muted">Stellar testnet</p>
          <p class="label muted">evergreen-stellar.pages.dev</p>
        </div>
        <div class="spacer"></div>
      </div>
    </div>
  </body>
</html>
