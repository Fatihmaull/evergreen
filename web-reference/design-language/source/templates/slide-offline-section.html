  <body class="ground-pine">
    <!-- Section divider, projector. Still pine. Cream at full strength, and the kicker is the body role, not the label role. -->

      data-format="slide offline 1920×1080 · k=2 · section"
      style="

        --h: 1080px;

        --safe-r: 160px;
        --safe-b: 96px;
        --safe-l: 160px;
      "

      <div class="safe">
        <div class="lockup">
          <span class="mark" aria-hidden="true"></span><span class="word">Evergreen</span>
        </div>
        <div class="spacer"></div>
        <p class="label">The four kinds of entry</p>
        <p class="display" style="margin-top: 24px">Three are recoverable. One is not.</p>
        <div class="spacer"></div>
        <p class="label">Stellar testnet · evergreen-stellar.pages.dev</p>
      </div>
    </div>
