<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Newsreader:opsz,wght@6..72,400&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="slides.css" />
    <script>
      if (location.search.includes('guides')) document.documentElement.classList.add('guides');
    </script>
    <title>Slide 1920 × 1080 — cover, projector</title>
  </head>
  <body class="ground-surface">
    <!-- Cover, projector. Surface, so the type is ink on cream. Same words as the online cover. No .62 text. The display line is the one dominant element. -->
    <div
      class="canvas slide-offline"
      data-format="slide offline 1920×1080 · k=2 · cover"
      style="
        --w: 1920px;
        --h: 1080px;
        --safe-t: 96px;
        --safe-r: 160px;
        --safe-b: 96px;
        --safe-l: 160px;
      "
    >
      <div class="safe">
        <div class="lockup">
          <span class="mark" aria-hidden="true"></span><span class="word">Evergreen</span>
        </div>
        <div class="spacer"></div>
        <p class="display" style="max-width: 15ch">
          Your contract expires. You just don't know when.
        </p>
        <p class="lead" style="max-width: 52ch; margin-top: 40px">
          Soroban state runs on a timer measured in ledgers, about five seconds each, and nothing
          tells you it is running out.
        </p>
        <div class="spacer"></div>
        <p class="label">Stellar testnet · evergreen-stellar.pages.dev</p>
      </div>
    </div>
  </body>
</html>
