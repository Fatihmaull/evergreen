<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Newsreader:opsz,wght@6..72,400&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="slides.css" />
    <script>
      if (location.search.includes('guides')) document.documentElement.classList.add('guides');
    </script>
    <title>Slide 1920 × 1080 — closing, projector</title>
  </head>
  <body class="ground-surface">
    <!-- Closing, projector. Surface and full ink. The button stays the primary button, at the body role, which is already its size. -->
    <div
      class="canvas slide-offline"
      data-format="slide offline 1920×1080 · k=2 · closing"
      style="
        --w: 1920px;
        --h: 1080px;
        --safe-t: 96px;
        --safe-r: 160px;
        --safe-b: 96px;
        --safe-l: 160px;
      "
    >
      <div class="safe">
        <div class="lockup">
          <span class="mark" aria-hidden="true"></span><span class="word">Evergreen</span>
        </div>
        <div class="spacer"></div>
        <div style="display: grid; gap: calc(16px * var(--k)); justify-items: start">
          <p class="display" style="max-width: 18ch">
            Ready to see what expires first in your Soroban contracts?
          </p>
          <p class="lead" style="max-width: 36ch">You need no key and no account to scan.</p>
          <p class="cta"><span>Open dashboard</span><span aria-hidden="true">→</span></p>
        </div>
        <div class="spacer"></div>
        <p class="label">Stellar testnet · evergreen-stellar.pages.dev</p>
      </div>
    </div>
  </body>
</html>
