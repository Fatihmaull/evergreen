<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Newsreader:opsz,wght@6..72,400&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="slides.css" />
    <script>
      if (location.search.includes('guides')) document.documentElement.classList.add('guides');
    </script>
    <title>Slide 1920 × 1080 — code, projector</title>
  </head>
  <body class="ground-surface">
    <!-- Code slide, projector. The same command. The kicker is not muted, and the terminal is set at the body role. -->
    <div
      class="canvas slide-offline"
      data-format="slide offline 1920×1080 · k=2 · code"
      style="
        --w: 1920px;
        --h: 1080px;
        --safe-t: 96px;
        --safe-r: 160px;
        --safe-b: 96px;
        --safe-l: 160px;
      "
    >
      <div class="safe">
        <div class="lockup">
          <span class="mark" aria-hidden="true"></span><span class="word">Evergreen</span>
        </div>
        <div class="spacer"></div>
        <p class="label">A scan is a read</p>
        <pre class="terminal" style="margin-top: calc(16px * var(--k))">
npx @evergreen-stellar/cli@&lt;version&gt; scan &lt;contract-id&gt;</pre>
        <div class="spacer"></div>
        <p class="label">Stellar testnet · evergreen-stellar.pages.dev</p>
      </div>
    </div>
  </body>
</html>
