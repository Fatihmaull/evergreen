<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Newsreader:opsz,wght@6..72,400&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="slides.css" />
    <script>
      if (location.search.includes('guides')) document.documentElement.classList.add('guides');
    </script>
    <title>Slide 1920 × 1080 — text, online</title>
  </head>
  <body class="ground-surface">
    <!-- Text slide. The heading is the one dominant element. Nothing over 80px. -->
    <div
      class="canvas"
      data-format="slide online 1920×1080 · k=2 · text"
      style="
        --w: 1920px;
        --h: 1080px;
        --safe-t: 96px;
        --safe-r: 160px;
        --safe-b: 96px;
        --safe-l: 160px;
      "
    >
      <div class="safe">
        <div class="lockup">
          <span class="mark" aria-hidden="true"></span><span class="word">Evergreen</span>
        </div>
        <div class="spacer"></div>
        <div style="display: grid; gap: calc(10px * var(--k)); max-width: 44ch">
          <p class="head">Absence is not health.</p>
          <p class="lead">A clean scan covers only what was asked for.</p>
          <p class="body second">
            Undetermined, unread, not found. Three ways a scan declines to conclude, and they are
            not the same as an error.
          </p>
        </div>
        <div class="spacer"></div>
        <p class="label muted">Stellar testnet · evergreen-stellar.pages.dev</p>
      </div>
    </div>
  </body>
</html>
