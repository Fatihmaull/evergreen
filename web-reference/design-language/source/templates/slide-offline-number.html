<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Newsreader:opsz,wght@6..72,400&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="slides.css" />
    <script>
      if (location.search.includes('guides')) document.documentElement.classList.add('guides');
    </script>
    <title>Slide 1920 × 1080 — number, projector</title>
  </head>
  <body class="ground-surface">
    <!-- Number slide, projector. Same figures, unrounded. The slab label and caption are full cream, and the label is the body role. -->
    <div
      class="canvas slide-offline"
      data-format="slide offline 1920×1080 · k=2 · number"
      style="
        --w: 1920px;
        --h: 1080px;
        --safe-t: 96px;
        --safe-r: 160px;
        --safe-b: 96px;
        --safe-l: 160px;
      "
    >
      <div class="safe">
        <div class="lockup">
          <span class="mark" aria-hidden="true"></span><span class="word">Evergreen</span>
        </div>
        <div class="spacer"></div>
        <div class="figure">
          <span class="label">of the rent</span>
          <span class="figure-value">98%</span>
          <p class="figure-caption body">
            is that one shared code entry — 8,116,648 of 8,264,289 stroops, across all four of
            guinea-pig A's entries. Scanning only its instance and code, the same entry is 99%:
            identical rent, different denominator.
          </p>
        </div>
        <div class="spacer"></div>
        <p class="label">Stellar testnet · evergreen-stellar.pages.dev</p>
      </div>
    </div>
  </body>
</html>
